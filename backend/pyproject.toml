[project]
name = "catan-simulator"
version = "0.1.0"
description = "A Catan board game simulator with web visualization"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "httpx>=0.25.1",  # For testing FastAPI endpoints
]
